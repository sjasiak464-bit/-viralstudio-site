databases:
  - name: viralstudio-db
    databaseName: viralstudio_db
    user: viralstudio_db_user
    plan: free
    region: ohio

services:
  - type: web
    name: viralstudio-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: viralstudio-db
          property: connectionString
      - key: GITHUB_OWNER
        value: sjasiak464-bit
      - key: CRM_API_KEY
        sync: false
      - key: PUBLISH_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
