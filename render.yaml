databases:
  - name: viralstudio-db
    databaseName: viralstudio_db
    user: viralstudio_db_user
    plan: free
    region: ohio

services:
  - type: web
    name: viralstudio-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: viralstudio-db
          property: connectionString
      - key: GITHUB_OWNER
        value: sjasiak464-bit
      - key: CRM_API_KEY
        sync: false
      - key: PUBLISH_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: cron
    name: viralstudio-discovery
    runtime: node
    plan: free
    region: ohio
    schedule: "0 14 * * 1-5"
    buildCommand: npm install
    startCommand: node discovery-worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: viralstudio-db
          property: connectionString
      - key: SEARCH_CITIES
        value: Montreal,Laval,Longueuil,Sainte-Martine,Chateauguay,Valleyfield,Quebec
