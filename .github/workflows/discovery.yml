name: ViralStudio background discovery
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Start scheduled prospect discovery
        run: |
          curl --fail --silent --show-error -X POST https://viralstudio-api.onrender.com/api/discover -H "X-ViralStudio-Key: ${{ secrets.VIRALSTUDIO_CRM_KEY }}"
