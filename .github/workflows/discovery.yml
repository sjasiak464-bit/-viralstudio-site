name: ViralStudio background discovery
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node discovery-worker.js
        env:
          DATABASE_URL: ${{ secrets.VIRALSTUDIO_DATABASE_URL }}
          SEARCH_CITIES: Montreal,Laval,Longueuil,Sainte-Martine,Chateauguay,Valleyfield,Quebec
