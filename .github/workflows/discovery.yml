name: ViralStudio background discovery

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viralstudio-prospect-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start scheduled prospect discovery
        env:
          CRM_KEY: ${{ secrets.VIRALSTUDIO_CRM_KEY }}
        run: |
          if [ -z "$CRM_KEY" ]; then
            echo "Missing VIRALSTUDIO_CRM_KEY repository secret."
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -X POST "https://viralstudio-api.onrender.com/api/discover" \
            -H "X-ViralStudio-Key: $CRM_KEY"
